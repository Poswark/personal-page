name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["trunk", "feature/*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          echo "📁 Verificando estructura del proyecto..."
          for file in index.html styles.css script.js; do
            if [ ! -f "$file" ]; then
              echo "❌ Falta el archivo requerido: $file"
              exit 1
            fi
          done
          echo "✅ Todos los archivos requeridos están presentes"

          # Informar si cv.pdf está presente (modo descarga directa activo)
          if [ -f "cv.pdf" ]; then
            echo "📄 cv.pdf encontrado — descarga directa habilitada"
          else
            echo "ℹ️  cv.pdf no encontrado — se usará generación dinámica del PDF"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Portfolio desplegado exitosamente"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"