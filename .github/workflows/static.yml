name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["trunk", "feature/*", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          echo "📁 Verificando estructura del proyecto..."
          for file in index.html styles.css script.js; do
            if [ ! -f "$file" ]; then
              echo "❌ Falta el archivo requerido: $file"
              exit 1
            fi
          done
          echo "✅ Todos los archivos requeridos están presentes"

          if [ -f "cv.pdf" ]; then
            echo "📄 cv.pdf encontrado (ES)"
          fi
          if [ -f "cv-en.pdf" ]; then
            echo "📄 cv-en.pdf encontrado (EN)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Portfolio desplegado exitosamente"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
